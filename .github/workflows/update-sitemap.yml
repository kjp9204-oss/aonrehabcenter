name: Update public sitemap

on:
  push:
    branches: [main]
    paths:
      - "**/*.html"
      - ".github/scripts/generate_sitemap.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-public-sitemap
  cancel-in-progress: true

jobs:
  sitemap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Generate sitemap from public pages
        run: python3 .github/scripts/generate_sitemap.py
      - name: Commit sitemap when changed
        run: |
          if git diff --quiet -- sitemap.xml; then
            echo "Sitemap is already current."
            exit 0
          fi
          git config user.name "aon-sitemap-bot"
          git config user.email "actions@users.noreply.github.com"
          git add sitemap.xml
          git commit -m "Update public sitemap"
          git push
